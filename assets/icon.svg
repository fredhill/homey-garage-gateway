<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <!--
    Garage Gateway app icon.
    Single-color house silhouette on a transparent background, with the
    garage door opening cut out as true negative space (fill-rule
    evenodd) and the panel divider lines drawn inside the opening.
    Homey renders icons in one color, so no background fill is used
    (App Store Guideline 1-5).
  -->
  <path fill="#000000" fill-rule="evenodd"
        d="M14 44 L50 14 L86 44 L86 86 L14 86 Z M28 50 h44 v36 h-44 Z"/>

  <!-- Panel divider lines inside the door opening -->
  <rect x="28" y="58" width="44" height="2" fill="#000000"/>
  <rect x="28" y="67" width="44" height="2" fill="#000000"/>
  <rect x="28" y="76" width="44" height="2" fill="#000000"/>

  <!-- Door handle -->
  <circle cx="64" cy="72.5" r="1.5" fill="#000000"/>
</svg>
