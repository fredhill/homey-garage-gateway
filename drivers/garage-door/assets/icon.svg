<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <!--
    Garage Door driver icon.
    White panelled garage door silhouette; the panel divider lines, the
    row of small windows at the top, the handle, and the gap under the
    door are all negative space (brand colour showing through). Reads
    clearly as a residential overhead garage door at small sizes —
    distinct from both the app icon and the hub icon.
  -->
  <rect width="100" height="100" fill="#1F4E79"/>

  <!-- Door body — slightly inset from the canvas so it reads as a door, not a square -->
  <rect x="18" y="14" width="64" height="68" rx="2" ry="2" fill="#ffffff"/>

  <!-- Door floor / gap underneath (negative space — door is "lifted") -->
  <rect x="14" y="82" width="72" height="4" fill="#1F4E79"/>

  <!-- Panel divider lines (negative space) — four horizontal panels -->
  <rect x="18" y="31" width="64" height="2" fill="#1F4E79"/>
  <rect x="18" y="48" width="64" height="2" fill="#1F4E79"/>
  <rect x="18" y="65" width="64" height="2" fill="#1F4E79"/>

  <!-- Top-row windows (three small panes — negative space) -->
  <rect x="26" y="20" width="10" height="6" rx="0.8" fill="#1F4E79"/>
  <rect x="45" y="20" width="10" height="6" rx="0.8" fill="#1F4E79"/>
  <rect x="64" y="20" width="10" height="6" rx="0.8" fill="#1F4E79"/>

  <!-- Handle on the second panel from the bottom (negative space) -->
  <rect x="48" y="73" width="4" height="3" rx="0.8" fill="#1F4E79"/>
</svg>
