<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <!--
    Gate driver icon.
    Single-color double swing-gate silhouette on a transparent background:
    two hinge posts, two gate leaves with vertical pickets, top/bottom
    rails and a diagonal brace on each leaf. Stroke-based, single colour,
    no background fill (App Store Guideline 1-5) — same family as the app,
    hub and door icons.
  -->
  <g fill="none" stroke="#000000" stroke-width="4" stroke-linecap="round" stroke-linejoin="round">
    <!-- Hinge posts -->
    <line x1="14" y1="26" x2="14" y2="86"/>
    <line x1="86" y1="26" x2="86" y2="86"/>

    <!-- Leaf frames: top and bottom rails for each leaf (gap at the centre) -->
    <rect x="16" y="40" width="32" height="40"/>
    <rect x="52" y="40" width="32" height="40"/>

    <!-- Diagonal braces (one per leaf, mirrored) -->
    <line x1="16" y1="80" x2="48" y2="40"/>
    <line x1="84" y1="80" x2="52" y2="40"/>
  </g>

  <!-- Vertical pickets (thinner) -->
  <g fill="none" stroke="#000000" stroke-width="2.6" stroke-linecap="round">
    <line x1="26" y1="40" x2="26" y2="80"/>
    <line x1="37" y1="40" x2="37" y2="80"/>
    <line x1="63" y1="40" x2="63" y2="80"/>
    <line x1="74" y1="40" x2="74" y2="80"/>
  </g>
</svg>
