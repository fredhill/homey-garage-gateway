<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <!--
    iSmartGate Hub driver icon.
    Single-color hub silhouette on a transparent background. The status
    LEDs, WiFi arcs and vent slits are true negative space cut out of
    the body with fill-rule evenodd; the antennas are drawn on top.
    No background fill (App Store Guideline 1-5).
  -->

  <!-- Antennas -->
  <line x1="28" y1="38" x2="22" y2="20" stroke="#000000" stroke-width="3" stroke-linecap="round"/>
  <line x1="72" y1="38" x2="78" y2="20" stroke="#000000" stroke-width="3" stroke-linecap="round"/>
  <circle cx="22" cy="20" r="3" fill="#000000"/>
  <circle cx="78" cy="20" r="3" fill="#000000"/>

  <!-- Hub body with LED / WiFi / vent cut-outs -->
  <path fill="#000000" fill-rule="evenodd" d="
    M21 36 h58 a5 5 0 0 1 5 5 v34 a5 5 0 0 1 -5 5 h-58 a5 5 0 0 1 -5 -5 v-34 a5 5 0 0 1 5 -5 Z
    M25 56 a3 3 0 1 0 6 0 a3 3 0 1 0 -6 0 Z
    M35 56 a3 3 0 1 0 6 0 a3 3 0 1 0 -6 0 Z
    M45 56 a3 3 0 1 0 6 0 a3 3 0 1 0 -6 0 Z
    M68.4 68 a1.6 1.6 0 1 0 3.2 0 a1.6 1.6 0 1 0 -3.2 0 Z
    M63.5 68 A6.5 6.5 0 0 1 76.5 68 L74 68 A4 4 0 0 0 66 68 Z
    M59.5 68 A10.5 10.5 0 0 1 80.5 68 L78 68 A8 8 0 0 0 62 68 Z
    M22 72 h14 v2 h-14 Z
    M40 72 h14 v2 h-14 Z
  "/>
</svg>
