<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <!--
    iSmartGate Hub driver icon.
    White box silhouette with the status LEDs and WiFi arcs rendered as
    negative space (brand color cut-outs), plus two stubby antennas at
    the top. Distinct from the app icon (house+door) and from the door
    driver icon (panelled door). Outline / negative-space style per
    Homey App Store Guideline 1-5.
  -->
  <rect width="100" height="100" fill="#1F4E79"/>

  <!-- Antennas first so the box covers their bases -->
  <line x1="28" y1="36" x2="22" y2="20" stroke="#ffffff" stroke-width="3" stroke-linecap="round"/>
  <line x1="72" y1="36" x2="78" y2="20" stroke="#ffffff" stroke-width="3" stroke-linecap="round"/>
  <circle cx="22" cy="20" r="3" fill="#ffffff"/>
  <circle cx="78" cy="20" r="3" fill="#ffffff"/>

  <!-- Hub body (rounded rectangle) -->
  <rect x="16" y="36" width="68" height="44" rx="5" ry="5" fill="#ffffff"/>

  <!-- Top brand stripe (negative-space band so the box reads as a device) -->
  <rect x="16" y="36" width="68" height="6" rx="5" ry="5" fill="#1F4E79"/>
  <rect x="16" y="40" width="68" height="2" fill="#1F4E79"/>

  <!-- Status LEDs — three negative-space dots -->
  <circle cx="28" cy="56" r="3" fill="#1F4E79"/>
  <circle cx="38" cy="56" r="3" fill="#1F4E79"/>
  <circle cx="48" cy="56" r="3" fill="#1F4E79"/>

  <!-- WiFi arcs (negative space) — two concentric arcs from a centre dot -->
  <circle cx="70" cy="68" r="1.6" fill="#1F4E79"/>
  <path d="M64 68 A 6 6 0 0 1 76 68" fill="none" stroke="#1F4E79" stroke-width="1.8" stroke-linecap="round"/>
  <path d="M60 68 A 10 10 0 0 1 80 68" fill="none" stroke="#1F4E79" stroke-width="1.8" stroke-linecap="round"/>

  <!-- Vent slits on the bottom strip (negative space) -->
  <rect x="22" y="72" width="14" height="2" rx="1" fill="#1F4E79"/>
  <rect x="40" y="72" width="14" height="2" rx="1" fill="#1F4E79"/>
</svg>
